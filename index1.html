<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="container">
      <div class="card">
        <img
          src="https://avatars.mds.yandex.net/i?id=b18f3086afd2aea9f62551d1cbb41e7427a76ca6-11860401-images-thumbs&n=13"
          alt="Ankara"
        />
        <h3>Ankara</h3>
        <p>Ankara is the capital of Turkey.</p>
        <button>Explore Turkey</button>
      </div>

      <div class="card">
        <img
          src="https://avatars.mds.yandex.net/i?id=7a91b0d0c1f30192d9b17819cb7e88ccd2295cd3-7646163-images-thumbs&n=13"
          alt="Paris"
        />
        <h3>Paris</h3>
        <p>Paris is the capital of France.</p>
        <button>Visit France</button>
      </div>

      <div class="card">
        <img
          src="https://avatars.mds.yandex.net/i?id=da7995f2204b1308e223c2302f2436a85b7666b8-5008975-images-thumbs&n=13"
          alt="London"
        />
        <h3>London</h3>
        <p>London is the capital of the UK.</p>
        <button>Discover UK</button>
      </div>

      <div class="card">
        <img
          src="https://avatars.mds.yandex.net/i?id=a1a9792824af1560945bd1ee8ed0069e2b7d3d5f-5298414-images-thumbs&n=13"
          alt="Tokyo"
        />
        <h3>Tokyo</h3>
        <p>Tokyo is the capital of Japan.</p>
        <button>Explore Japan</button>
      </div>

      <div class="card">
        <img
          src="https://pics.rbc.ru/v2_companies_s3/resized/960xH/media/company_press_release_image/0bc67401-a918-468c-8888-08a1f0a99707.jpg"
          alt="Berlin"
        />
        <h3>Berlin</h3>
        <p>Berlin is the capital of Germany.</p>
        <button>Visit Germany</button>
      </div>

      <div class="card">
        <img
          src="https://avatars.mds.yandex.net/i?id=f6748910e23c432e4a5682e9e1a7e78f64b7632d-7051630-images-thumbs&n=13"
          alt="Roma"
        />

        <h3>Rome</h3>
        <p>Rome is the capital of Italy.</p>
        <button>Discover Italy</button>
      </div>
    </section>
  </body>
</html>
